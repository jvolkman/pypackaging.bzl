# Tag a new release using https://github.com/marketplace/actions/conventional-commits-versioner-action
#
# smlx/ccv proposes the next version from the conventional commits since the
# last tag. While the version is 0.x, a breaking change (`feat!:`, `fix!:` or
# a `BREAKING CHANGE:` footer) bumps the minor version instead of the major
# version (v0.2.3 -> v0.3.0); see next_version.sh. From 1.0 on, major
# releases have to be tagged by hand (see CONTRIBUTING.md).
name: Tag a Release
on:
  workflow_dispatch:
  # schedule:
  #   - cron: "0 15 * * *" # Daily at 3PM UTC
jobs:
  tag:
    # Only tag the default branch: the version is computed from its history.
    if: github.ref == 'refs/heads/main'
    permissions:
      contents: write # allow create tag
    runs-on: ubuntu-latest
    outputs:
      new-tag: ${{ steps.ccv.outputs.new-tag }}
      new-tag-version: ${{ steps.version.outputs.new-tag-version }}
      new-tag-version-type: ${{ steps.version.outputs.new-tag-version-type }}
      recently-tagged: ${{ steps.recent-tag.outputs.recently-tagged }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Check if there is a recent tag
        id: recent-tag
        if: github.event_name == 'schedule'
        run: |
          MAX_AGE=1209600  # 2 weeks
          TAG=$(git describe --tags --match 'v[0-9]*.[0-9]*.[0-9]*' --abbrev=0 2>/dev/null) || {
            echo "No matching tag — continue workflow."
            exit 0
          }
          TAG_TIME=$(git log -1 --format=%ct "$TAG")
          NOW=$(date +%s)
          AGE=$((NOW - TAG_TIME))
          echo "Latest tag: $TAG ($AGE seconds ago)"
          if [ "$AGE" -lt "$MAX_AGE" ]; then
            echo "recently-tagged=true" >> "$GITHUB_OUTPUT"
          fi
      - name: Compute next version
        id: ccv
        if: github.event_name != 'schedule' || steps.recent-tag.outputs.recently-tagged != 'true'
        uses: smlx/ccv@v0.10.0
        with:
          # ccv would push the tag it computed, e.g. v1.0.0 for a breaking
          # change on 0.x. The next step decides the tag and pushes it instead.
          write-tag: false
      - name: Adjust version and push tag
        id: version
        if: steps.ccv.outputs.new-tag == 'true'
        env:
          CCV_TAG: ${{ steps.ccv.outputs.new-tag-version }}
          CCV_TYPE: ${{ steps.ccv.outputs.new-tag-version-type }}
        run: |
          .github/workflows/next_version.sh > "$RUNNER_TEMP/next_version.txt"
          cat "$RUNNER_TEMP/next_version.txt" >> "$GITHUB_OUTPUT"
          NEW_TAG="$(sed -n 's/^new-tag-version=//p' "$RUNNER_TEMP/next_version.txt")"
          git tag "$NEW_TAG"
          git push origin "refs/tags/$NEW_TAG"
  release:
    needs: tag
    uses: ./.github/workflows/release.yaml
    with:
      tag_name: ${{ needs.tag.outputs.new-tag-version }}
    secrets:
      publish_token: ${{ secrets.BCR_PUBLISH_TOKEN }}
    # Tags pushed with GITHUB_TOKEN don't trigger release.yaml's `push` trigger,
    # so the release is started from here.
    if: needs.tag.outputs.new-tag == 'true' && needs.tag.outputs.new-tag-version != ''
    permissions:
      contents: write
      id-token: write
      attestations: write
