name: CI
# Controls when the action will run.
on:
  # Triggers the workflow on push or pull request events but only for the main branch
  push:
    branches: [main]
  pull_request:
    branches: [main]
  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:
concurrency:
  # Cancel previous actions from the same PR or branch except 'main' branch.
  # See https://docs.github.com/en/actions/using-jobs/using-concurrency and https://docs.github.com/en/actions/learn-github-actions/contexts for more info.
  group: concurrency-group::${{ github.workflow }}::${{ github.event.pull_request.number > 0 && format('pr-{0}', github.event.pull_request.number) || github.ref_name }}${{ github.ref_name == 'main' && format('::{0}', github.run_id) || ''}}
  cancel-in-progress: ${{ github.ref_name != 'main' }}
permissions:
  contents: read
jobs:
  test:
    name: test (${{ matrix.os }}, bazel ${{ matrix.bazel }})
    strategy:
      fail-fast: false
      matrix:
        # "pinned" uses the version in .bazelversion (also pinned in docs/ and
        # e2e/smoke/). The other legs override it with USE_BAZEL_VERSION.
        # 7.1.0 is the oldest supported version (bazel_compatibility).
        os: [ubuntu-latest]
        bazel: [pinned, 7.1.0, 7.x, 9.x]
        include:
          # The library is pure Starlark, so the smoke test on the pinned
          # version is enough on macOS and Windows.
          - os: macos-latest
            bazel: pinned
          - os: windows-latest
            bazel: pinned
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v6
      - uses: bazel-contrib/setup-bazel@0.19.1
        with:
          bazelisk-cache: true
          repository-cache: true
      - name: Select Bazel version
        run: |
          if [[ "${{ matrix.bazel }}" != "pinned" ]]; then
            echo "USE_BAZEL_VERSION=${{ matrix.bazel }}" >> "$GITHUB_ENV"
          fi
          if [[ "${{ matrix.bazel }}" == "pinned" && "$RUNNER_OS" == "Linux" ]]; then
            # The checked-in lockfiles are generated by the pinned version on
            # Linux. Fail if one is stale.
            echo "LOCKFILE_FLAGS=--lockfile_mode=error" >> "$GITHUB_ENV"
          else
            # Don't rewrite lockfiles with another Bazel version or platform.
            echo "LOCKFILE_FLAGS=--lockfile_mode=off" >> "$GITHUB_ENV"
          fi
      - name: Run Tests
        if: runner.os == 'Linux' && matrix.bazel == 'pinned'
        # The preset is generated for the pinned Bazel version only, so its
        # update test is tagged manual and is run explicitly here.
        run: bazel test $LOCKFILE_FLAGS -- //... //tools:preset.update_test
      - name: Run Tests
        if: runner.os == 'Linux' && matrix.bazel == '9.x'
        run: bazel test $LOCKFILE_FLAGS //...
      - name: Run Tests
        if: runner.os == 'Linux' && startsWith(matrix.bazel, '7.')
        # tools/preset.bazelrc uses flags that Bazel 7 doesn't know.
        run: bazel --ignore_all_rc_files test $LOCKFILE_FLAGS //...
      - name: Run Doc Tests
        if: runner.os == 'Linux'
        run: bazel test $LOCKFILE_FLAGS //...
        working-directory: docs
      - name: Run E2E Tests
        run: bazel test $LOCKFILE_FLAGS //...
        working-directory: e2e/smoke
  pre-commit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: pre-commit/action@v3.0.1
  # For branch protection settings, this job provides a "stable" name that can be used to gate PR merges
  # on "all matrix jobs were successful".
  conclusion:
    needs: [test, pre-commit]
    runs-on: ubuntu-latest
    if: always()
    steps:
      - uses: technote-space/workflow-conclusion-action@45ce8e0eb155657ab8ccf346ade734257fd196a5 # v3.0.3
      # Note: possible conclusion values:
      # https://github.com/technote-space/workflow-conclusion-action/blob/main/src/constant.ts
      - name: report success
        if: ${{ env.WORKFLOW_CONCLUSION == 'success' }}
        working-directory: /tmp
        run: echo ${{ env.WORKFLOW_CONCLUSION }} && exit 0
      - name: report failure
        if: ${{ env.WORKFLOW_CONCLUSION == 'failure' }}
        working-directory: /tmp
        run: echo ${{ env.WORKFLOW_CONCLUSION }} && exit 1
